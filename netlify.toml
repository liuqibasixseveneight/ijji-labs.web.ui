[build]
    command = "npm run build"
    publish = "dist"
    functions = "netlify/functions"
    # Skip the build (and its credits) when nothing deployed has changed since the last one:
    # only tests, stories, docs, Markdown or CI config. `git diff --quiet` exits 0 (skip)
    # when the paths it watches are unchanged; any other change, or no earlier build to
    # compare with, builds as usual. In these pathspecs `*` also matches across folders.
    ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!*.test.ts' ':!*.test.tsx' ':!*__tests__*' ':!*.stories.tsx' ':!.storybook/*' ':!src/test/*' ':!docs/*' ':!*.md' ':!.github/*' ':!.claude/*'"

# `npm run preview:netlify` builds the site and serves it as Netlify will, with these headers
# and both functions, on http://localhost:8888. Plain `npm run dev` has no functions, so the
# forms get a 404 there. (`netlify dev` doesn't suit: this CSP blocks Vite's dev scripts.)

# Every page is pre-rendered to its own index.html at build time (scripts/prerender.mjs),
# so there is no single-page fallback: an address that isn't a page gets Netlify's
# 404 handling, which serves the pre-rendered dist/404.html with a real 404 status.
# Adding a page means adding it to the routes (and so to the prerender list), not here.

# Security headers for every response. The CSP allows only this site's own scripts,
# styles (inlined into each page by the prerender, and inline style attributes for the cut
# corners), fonts (the wordmark's 2.5 KB subset travels inside the stylesheet as a data:
# URI) and forms, plus project images from Unsplash. Check the browser console for CSP
# errors after adding a third party.
[[headers]]
    for = "/*"
    [headers.values]
        Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
        Strict-Transport-Security = "max-age=31536000; includeSubDomains"
        X-Frame-Options = "DENY"

# The admin dashboard (src/admin, its own page at admin/index.html). The edge gate
# (netlify/edge-functions/admin-gate/admin-gate.ts) runs first and answers 404 to anyone without a valid
# admin session, except on /admin/sign-in; this rewrite then serves the dashboard's page for
# every /admin address. Its functions (/api/admin/*) check the session again themselves.
# Never cached, never indexed, and no referrer leaves it. Not in robots.txt on purpose:
# listing it there would advertise it, and stop crawlers from seeing the noindex.
[[redirects]]
    from = "/admin"
    to = "/admin/index.html"
    status = 200

[[redirects]]
    from = "/admin/*"
    to = "/admin/index.html"
    status = 200

[[headers]]
    for = "/admin"
    [headers.values]
        Cache-Control = "no-store"
        X-Robots-Tag = "noindex, nofollow, noarchive"
        Referrer-Policy = "no-referrer"

[[headers]]
    for = "/admin/*"
    [headers.values]
        Cache-Control = "no-store"
        X-Robots-Tag = "noindex, nofollow, noarchive"
        Referrer-Policy = "no-referrer"

[[headers]]
    for = "/api/admin/*"
    [headers.values]
        Cache-Control = "no-store"
        X-Robots-Tag = "noindex, nofollow, noarchive"
        Referrer-Policy = "no-referrer"

# Built assets have a content hash in their name, so they can be cached for a year.
[[headers]]
    for = "/assets/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"
