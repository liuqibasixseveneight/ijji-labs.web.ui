[build]
    command = "npm run build"
    publish = "dist"
    functions = "netlify/functions"

# A single-page app: serve index.html for every path, so opening or refreshing
# /about (or any deep link) loads the app instead of Netlify's 404. Real files and
# /.netlify/functions/* are matched first.
[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200
