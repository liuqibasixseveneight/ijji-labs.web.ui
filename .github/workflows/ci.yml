name: CI

on:
    pull_request:
    push:
        branches: [master]

# A newer push to the same branch or PR replaces a run still going.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Format, lint and typecheck.
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck

    # Unit, navigation and site-map tests, against the coverage thresholds in vite.config.ts.
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run test:coverage

    # The site and Storybook both build.
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run build-storybook -- --quiet
